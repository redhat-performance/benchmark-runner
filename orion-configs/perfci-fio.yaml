- name: fio-vm-4k-read-centos
  metadata:
    kind: vm
    run_status: complete
    block_size: 4k
    io_operation: read
    vm_os_version: centos-stream10
  metrics:
  - name: total-iops
    metric_of_interest: total_iops
    agg:
      agg_type: avg
    threshold: 10
    direction: -1

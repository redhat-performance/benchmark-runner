apiVersion: v1
kind: Namespace
metadata:
  name: linstress-sync
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: linstress-barrier-script-deadbeef
  namespace: linstress-sync
data:
  barrier_server.py: |
    import socket
    import time
    import sys

    port = int(sys.argv[1])
    vm_count = int(sys.argv[2])
    timeout = int(sys.argv[3])
    result_path = sys.argv[4] if len(sys.argv) > 4 else ''

    srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    srv.bind(('0.0.0.0', port))
    srv.listen(vm_count + 10)

    conns = []
    start = time.time()
    try:
        while len(conns) < vm_count:
            remaining = timeout - (time.time() - start)
            if remaining <= 0:
                break
            srv.settimeout(remaining)
            try:
                conn, addr = srv.accept()
                conns.append(conn)
            except socket.timeout:
                break
    finally:
        srv.close()

    if result_path:
        with open(result_path, 'w') as f:
            f.write(str(len(conns)))

    # Printed as the last line so callers without a shared filesystem (e.g. a
    # Kubernetes pod, whose result is read back via `oc logs`) can parse it.
    print(f'BARRIER_RESULT:{len(conns)}')
---
apiVersion: v1
kind: Pod
metadata:
  name: linstress-barrier-deadbeef
  namespace: linstress-sync
  labels:
    app: linstress-barrier-deadbeef
spec:
  restartPolicy: Never
  containers:
    - name: barrier
      image: registry.access.redhat.com/ubi9/python-311:latest
      command: ["python3", "/barrier/barrier_server.py", "29999", "__BARRIER_VM_COUNT__", "900"]
      volumeMounts:
        - name: barrier-script
          mountPath: /barrier
  volumes:
    - name: barrier-script
      configMap:
        name: linstress-barrier-script-deadbeef
---
apiVersion: v1
kind: Service
metadata:
  name: linstress-barrier-deadbeef
  namespace: linstress-sync
spec:
  clusterIP: None
  selector:
    app: linstress-barrier-deadbeef
  ports:
    - name: tcp-29999
      port: 29999
      protocol: TCP
      targetPort: 29999
---
apiVersion: v1
kind: Service
metadata:
  name: linstress-barrier-deadbeef
  namespace: benchmark-runner
spec:
  type: ExternalName
  externalName: linstress-barrier-deadbeef.linstress-sync.svc.cluster.local
  ports:
    - name: tcp-29999
      port: 29999

apiVersion: v1
kind: Secret
metadata:
  name: linstress-cloudinit-deadbeef
  namespace: benchmark-runner
stringData:
  userdata: |
    #cloud-config
    user: fedora
    password: fedora
    chpasswd: { expire: False }
    ssh_pwauth: true
    packages:
      - python3-psutil
    write_files:
      - path: /tmp/stress.py
        permissions: '0755'
        content: |
          import multiprocessing, time, psutil, json, datetime

          MEM_BUFFER_MB = 1024

          def burn_cpu(d, result_dict, idx, bucket_sec=10):
              # Sequential write over a memory block larger than L3, per rlk's suggestion:
              # a plain counter-write loop defeats cache residency without relying on
              # random access, so throughput reflects real memory write bandwidth.
              size = MEM_BUFFER_MB * 1024 * 1024
              buf = bytearray(b'a')
              buf *= size
              counter = 0
              start = time.perf_counter()
              end = start + d
              ops = 0
              buckets = []
              next_bucket_at = start + bucket_sec
              bucket_start_ops = 0
              bucket_start_time = start
              chunk = 1024 * 1024
              stop = False
              while not stop:
                  for chunk_start in range(0, size, chunk):
                      chunk_end = min(chunk_start + chunk, size)
                      for i in range(chunk_start, chunk_end):
                          buf[i] = counter & 0xff
                          counter += 1
                      ops += chunk_end - chunk_start
                      now = time.perf_counter()
                      if now >= end:
                          stop = True
                      if now >= next_bucket_at or stop:
                          b_ops = ops - bucket_start_ops
                          b_elapsed = now - bucket_start_time
                          buckets.append({'ops': b_ops, 'elapsed': b_elapsed, 'ops_per_sec': b_ops / b_elapsed if b_elapsed > 0 else 0})
                          bucket_start_ops = ops
                          bucket_start_time = now
                          next_bucket_at = now + bucket_sec
                      if stop:
                          break
              final_now = time.perf_counter()
              if final_now > bucket_start_time:
                  b_ops = ops - bucket_start_ops
                  b_elapsed = final_now - bucket_start_time
                  buckets.append({'ops': b_ops, 'elapsed': b_elapsed, 'ops_per_sec': b_ops / b_elapsed if b_elapsed > 0 else 0})
              elapsed = time.perf_counter() - start
              result_dict[idx] = {'ops': ops, 'elapsed': elapsed, 'ops_per_sec': ops / elapsed, 'buckets': buckets}

          def burn_memory(target_percent, duration):
              total = psutil.virtual_memory().total
              target_bytes = int(total * target_percent / 100)
              current_used = psutil.virtual_memory().used
              alloc_bytes = target_bytes - current_used
              if alloc_bytes <= 0:
                  print(f'Memory already at {psutil.virtual_memory().percent}%, skipping')
                  return
              chunk_size = 100 * 1024 * 1024
              blocks = []
              allocated = 0
              while allocated < alloc_bytes:
                  size = min(chunk_size, alloc_bytes - allocated)
                  blocks.append(bytearray(size))
                  allocated += size
                  print(f'Allocated {allocated // (1024*1024)}MB / {alloc_bytes // (1024*1024)}MB ({psutil.virtual_memory().percent}%)')
              print(f'Memory at {psutil.virtual_memory().percent}%, holding for {duration}s...')
              time.sleep(duration)

          if __name__ == '__main__':
              run_start_time = datetime.datetime.utcnow().isoformat()
              cpu_total = multiprocessing.cpu_count()
              cpu_count = max(1, int(cpu_total * 100 / 100))
              duration = 600
              mem_target = 50

              print(f'CPU count: {cpu_total}')
              print(f'Stressing {cpu_count} CPUs (100%) and {mem_target}% memory for {duration}s')
              print(f'Total memory: {psutil.virtual_memory().total // (1024**2)}MB')
              print(f'Memory before: {psutil.virtual_memory().percent}%')
              print(f'CPU before: {psutil.cpu_percent(interval=1)}%')

              mem_proc = None
              if mem_target > 0:
                  mem_proc = multiprocessing.Process(target=burn_memory, args=(mem_target, duration))
                  mem_proc.start()
                  time.sleep(5)

              manager = multiprocessing.Manager()
              result_dict = manager.dict()

              cpu_procs = [multiprocessing.Process(target=burn_cpu, args=(duration, result_dict, i)) for i in range(cpu_count)]
              [p.start() for p in cpu_procs]

              intervals = max(1, duration // 30)
              samples = []
              for i in range(intervals):
                  time.sleep(30)
                  mem = psutil.virtual_memory()
                  cpu_pct = psutil.cpu_percent(interval=1)
                  sample = {
                      'time_sec': (i+1)*30,
                      'cpu_percent': cpu_pct,
                      'mem_percent': mem.percent,
                      'mem_used_mb': round(mem.used / (1024**2), 1),
                      'mem_total_mb': round(mem.total / (1024**2), 1),
                      'mem_used_gb': round(mem.used / (1024**3), 1),
                      'mem_total_gb': round(mem.total / (1024**3), 1)
                  }
                  samples.append(sample)
                  print(f"At {sample['time_sec']}s: CPU={cpu_pct}% MEM={mem.percent}% ({sample['mem_used_mb']}MB/{sample['mem_total_mb']}MB)")

              [p.join() for p in cpu_procs]
              if mem_proc:
                  mem_proc.join()

              total_ops = sum(r['ops'] for r in result_dict.values())
              total_ops_per_sec = sum(r['ops_per_sec'] for r in result_dict.values())
              avg_ops_per_sec = total_ops_per_sec / cpu_count if cpu_count > 0 else 0

              print(f'CPU after: {psutil.cpu_percent(interval=1)}%')
              print(f'Memory after: {psutil.virtual_memory().percent}%')
              print(f'Total operations: {total_ops:,}')
              print(f'Total throughput: {total_ops_per_sec:,.0f} ops/sec')
              print(f'Avg per CPU: {avg_ops_per_sec:,.0f} ops/sec')

              run_end_time = datetime.datetime.utcnow().isoformat()
              report = {
                  'config': {
                      'cpu_total': cpu_total,
                      'cpu_stressed': cpu_count,
                      'stress_cpu_percent': 100,
                      'stress_memory_percent': mem_target,
                      'duration_sec': duration,
                      'total_memory_gb': round(psutil.virtual_memory().total / (1024**3), 1),
                      'total_memory_mb': round(psutil.virtual_memory().total / (1024**2), 1),
                      'run_start_time_utc': run_start_time,
                      'run_end_time_utc': run_end_time
                  },
                  'throughput': {
                      'total_ops': total_ops,
                      'total_ops_per_sec': round(total_ops_per_sec, 2),
                      'avg_ops_per_cpu': round(avg_ops_per_sec, 2),
                      'per_cpu': [{'cpu': i, 'ops': r['ops'], 'ops_per_sec': round(r['ops_per_sec'], 2),
                                   'buckets': [{'ops': b['ops'], 'elapsed': round(b['elapsed'], 3), 'ops_per_sec': round(b['ops_per_sec'], 2)} for b in r.get('buckets', [])]}
                                  for i, r in sorted(result_dict.items())]
                  },
                  'samples': samples
              }

              with open('/tmp/stress_report.json', 'w') as f:
                  json.dump(report, f, indent=2)
              print('Report saved to /tmp/stress_report.json')
              print('Done')
    runcmd:
      - export HOME=/root
      - dnf install -y python3-psutil || true
      - |
        touch /tmp/vm_ready
        end=$((SECONDS+900))
        while ((SECONDS < end)); do
          if nc -w 900 linstress-barrier-deadbeef 29999 < /dev/null > /dev/null 2>&1; then
            break
          fi
          sleep 0.5
        done
        python3 /tmp/stress.py
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: linstress-vm-deadbeef
  labels:
    kubevirt.io/vm: linstress-vm-deadbeef
  namespace: benchmark-runner
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: linstress-vm-deadbeef
    spec:
      nodeSelector:
        kubernetes.io/hostname: 'None'
      domain:
        cpu:
          sockets: 1
          cores: 2
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: containerdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - name: default
              masquerade: {}
          networkInterfaceMultiqueue: true
        machine:
          type: ""
        resources:
          requests:
            cpu: 1
            memory: 4Gi
      terminationGracePeriodSeconds: 180
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/benchmark-runner/fedora-container-disk:43
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: linstress-cloudinit-deadbeef

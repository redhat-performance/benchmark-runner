apiVersion: v1
kind: Namespace
metadata:
  name: winstress-sync
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: winstress-barrier-script-{{ trunc_uuid }}
  namespace: winstress-sync
data:
  barrier_server.py: |
{{ barrier_server_py | indent(width=4, first=True) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: winstress-barrier-{{ trunc_uuid }}
  namespace: winstress-sync
  labels:
    app: winstress-barrier-{{ trunc_uuid }}
spec:
  restartPolicy: Never
  containers:
    - name: barrier
      image: {{ barrier_container_image | default('registry.access.redhat.com/ubi9/python-311:latest', true) }}
      command: ["python3", "/barrier/barrier_server.py", "{{ barrier_port | default(29999) }}", "__BARRIER_VM_COUNT__", "{{ barrier_timeout | default(3600) }}"]
      env:
        - name: BARRIER_LEAD_SEC
          value: "{{ barrier_lead_sec | default(15) }}"
        - name: BARRIER_GRACE_SEC
          value: "{{ barrier_grace_sec | default(20) }}"
      volumeMounts:
        - name: barrier-script
          mountPath: /barrier
  volumes:
    - name: barrier-script
      configMap:
        name: winstress-barrier-script-{{ trunc_uuid }}
---
apiVersion: v1
kind: Service
metadata:
  name: winstress-barrier-{{ trunc_uuid }}
  namespace: winstress-sync
spec:
  clusterIP: None
  selector:
    app: winstress-barrier-{{ trunc_uuid }}
  ports:
    - name: barrier
      port: {{ barrier_port | default(29999) }}
      protocol: TCP
      targetPort: {{ barrier_port | default(29999) }}
---
apiVersion: v1
kind: Service
metadata:
  name: winstress-barrier-{{ trunc_uuid }}
  namespace: {{ namespace }}
spec:
  type: ExternalName
  externalName: winstress-barrier-{{ trunc_uuid }}.winstress-sync.svc.cluster.local
  ports:
    - name: barrier
      port: {{ barrier_port | default(29999) }}

apiVersion: v1
kind: Namespace
metadata:
  name: linstress-sync
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: linstress-barrier-script-{{ trunc_uuid }}
  namespace: linstress-sync
data:
  barrier_server.py: |
{{ barrier_server_py | indent(width=4, first=True) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: linstress-barrier-{{ trunc_uuid }}
  namespace: linstress-sync
  labels:
    app: linstress-barrier-{{ trunc_uuid }}
spec:
  restartPolicy: Never
  containers:
    - name: barrier
      image: {{ barrier_container_image | default('registry.access.redhat.com/ubi9/python-311:latest', true) }}
      command: ["python3", "/barrier/barrier_server.py", "29999", "__BARRIER_VM_COUNT__", "{{ barrier_timeout }}"]
      volumeMounts:
        - name: barrier-script
          mountPath: /barrier
  volumes:
    - name: barrier-script
      configMap:
        name: linstress-barrier-script-{{ trunc_uuid }}
---
apiVersion: v1
kind: Service
metadata:
  name: linstress-barrier-{{ trunc_uuid }}
  namespace: linstress-sync
spec:
  clusterIP: None
  selector:
    app: linstress-barrier-{{ trunc_uuid }}
  ports:
    - name: tcp-29999
      port: 29999
      protocol: TCP
      targetPort: 29999
---
apiVersion: v1
kind: Service
metadata:
  name: linstress-barrier-{{ trunc_uuid }}
  namespace: {{ namespace }}
spec:
  type: ExternalName
  externalName: linstress-barrier-{{ trunc_uuid }}.linstress-sync.svc.cluster.local
  ports:
    - name: tcp-29999
      port: 29999
